<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 120" width="420" height="120" fill="none">
  <!-- Eye outline (two arcs) - Deep Navy #0A2540 -->
  <path d="M28 60 C28 38 52 22 80 22 C108 22 132 38 132 60 C132 82 108 98 80 98 C52 98 28 82 28 60 Z" 
        stroke="#0A2540" stroke-width="8" fill="none" stroke-linecap="round"/>
  
  <!-- Small steering wheel - Muted Steel Blue / Cool Teal #5B8A9A -->
  <g transform="translate(80, 60)">
    <!-- Outer rim -->
    <circle cx="0" cy="0" r="14" stroke="#5B8A9A" stroke-width="3.5" fill="none"/>
    <!-- Inner hub -->
    <circle cx="0" cy="0" r="4.5" fill="#5B8A9A"/>
    <!-- Three spokes -->
    <line x1="0" y1="-14" x2="0" y2="-4.5" stroke="#5B8A9A" stroke-width="3" stroke-linecap="round"/>
    <line x1="-12.1" y1="7" x2="-3.9" y2="2.25" stroke="#5B8A9A" stroke-width="3" stroke-linecap="round"/>
    <line x1="12.1" y1="7" x2="3.9" y2="2.25" stroke="#5B8A9A" stroke-width="3" stroke-linecap="round"/>
  </g>
  
  <!-- Wordmark -->
  <text x="155" y="72" font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
        font-size="42" font-weight="500" fill="#0A2540" letter-spacing="-0.5">driverwatch</text>
</svg>